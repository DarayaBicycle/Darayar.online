<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darayar Powerpack | แบตเตอรี่ลิเธียมคุณภาพสูง</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Darayar<span>.online</span></div>
            <ul>
                <li><a href="#home">หน้าแรก</a></li>
                <li><a href="#products">สินค้า</a></li>
                <li><a href="#contact">ติดต่อเรา</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Darayar PowerPack 18650</h1>
        <p>แหล่งพลังงานสำหรับโปรเจกต์ของคุณ ตั้งแต่ 2S ถึง 10S</p>
        <a href="#products" class="btn">ดูรายการสินค้า</a>
    </section>

    <section id="products" class="container">
        <h2 class="section-title">รายการแบตเตอรี่แพ็ค</h2>
        <div id="product-grid" class="grid">
            </div>
    </section>

    <section id="contact" class="container">
        <h2 class="section-title">ติดต่อสอบถาม / สั่งซื้อ</h2>
        <form id="contactForm" class="contact-form">
            <input type="text" id="name" placeholder="ชื่อ-นามสกุล" required>
            <div class="form-row">
                <input type="email" id="email" placeholder="อีเมล">
                <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์">
            </div>
            <input type="text" id="subject" placeholder="หัวข้อติดต่อ" required>
            <textarea id="message" rows="5" placeholder="ข้อความของคุณ..." required></textarea>
            <button type="submit" class="btn">ส่งข้อความ</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Darayar Powerpack. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
